<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Chiranjib Sai Chandan Nath — Brut Security">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F1F5F9"/>
  </linearGradient>
  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#0891B2;#059669;#7C3AED" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#0891B2"><animate attributeName="stop-color" values="#0891B2;#059669;#7C3AED;#0891B2" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#059669"><animate attributeName="stop-color" values="#059669;#7C3AED;#0891B2;#059669" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <clipPath id="avatarClip">
    <circle cx="150" cy="180" r="88"/>
  </clipPath>
</defs>

<rect width="1180" height="360" fill="url(#bgGrad)"/>
<rect x="1" y="1" width="1178" height="358" fill="none" stroke="#E2E8F0" stroke-width="2" rx="14"/>

<!-- avatar -->
<circle cx="150" cy="180" r="92" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>
<image href="data:image/jpeg;base64," x="62" y="92" width="176" height="176" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

<!-- name -->
<text x="280" y="140" font-size="40" font-weight="700" fill="#0F172A">Chiranjib Sai Chandan Nath</text>
<text x="280" y="168" font-size="20" fill="#475569">a.k.a. Sanu · Android &amp; Mobile Security Researcher</text>

<!-- typing line -->
<rect x="280" y="190" width="640" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="296" y="213" font-size="17" fill="#0891B2">$ whoami</text>
<text x="410" y="213" font-size="17" fill="#0F172A">brut-security / pentester / no-root-no-glory</text>
<rect x="855" y="197" width="10" height="20" fill="#0891B2">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>

<!-- tags -->
<g font-size="14" fill="#475569">
  <rect x="280" y="240" width="120" height="28" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="300" y="258" fill="#0F172A">Android Sec</text>

  <rect x="410" y="240" width="100" height="28" rx="14" fill="none" stroke="#0891B2" stroke-width="1.5"/>
  <text x="430" y="258" fill="#0F172A">Web / API</text>

  <rect x="520" y="240" width="130" height="28" rx="14" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="540" y="258" fill="#0F172A">Pentesting</text>

  <rect x="660" y="240" width="140" height="28" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="680" y="258" fill="#0F172A">Tool Building</text>
</g>

<text x="280" y="300" font-size="15" fill="#475569">Brut Security — building AndroBrut and other offensive-security tooling.</text>
</svg>
